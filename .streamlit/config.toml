# Chat Shield: 밝은 문서형 테마. ui/styles.css의 기본 색과 일치시킨다.
[theme]
base = "light"
primaryColor = "#285DDD"            # 주요 행동. 버튼·강조·포커스
backgroundColor = "#F5F7FB"         # 페이지 배경
secondaryBackgroundColor = "#FFFFFF"  # 기본 패널
textColor = "#17243B"
font = "sans serif"


[browser]
gatherUsageStats = false
